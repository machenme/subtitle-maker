# Subtitle Maker Default Configuration
# All paths support both absolute and relative (to this config file) paths.

# --- Input / Output ---
input_dir: "."                    # Input media directory
output_dir: "./output"            # Output text/subtitle directory
temp_dir: null                    # Temp audio directory (null = system temp)

# --- Model ---
model_path: "./models/faster-whisper-large-v3-turbo-ct2"
model_size: "large-v3-turbo"      # Model size identifier
language: "auto"                  # Target language (ISO 639-1, "auto" = detect)
beam_size: 5                      # Beam search width (1-10)
vad_filter: true                  # Voice activity detection
compute_type: "float16"           # Inference precision: float16 | int8_float16

# --- External tools ---
# ffmpeg / ffprobe 留空 = 自动探测：PATH → 系统持久 PATH → winget/scoop/choco 常见安装位置。
# 只有当自动探测找不到时才需要填写（.exe 完整路径，或其所在目录）。
ffmpeg_path: ""
ffprobe_path: ""

# --- Concurrency ---
max_workers: null                  # Startup probe upper bound (null = 16; falls back on model-load failure)
chunk_duration: 0                  # 0 = auto (split evenly by worker count), >0 = manual seconds

# --- Media Scanning ---
video_extensions:
  - mp4
  - mkv
  - mov
  - avi
  - flv
  - wmv
  - m4a
  - mp3
  - wav
  - flac
  - ogg
  - opus
  - aac
  - wma

# --- Output ---
output_formats:                   # Formats to generate
  - srt
translate_to: "zh"                  # Auto-translate SRT to language ("" = skip)
translation_provider: "bing"        # bing | gtx | index_api | llm
                                    #   index_api = Index-Translate 官方免费 API（35B-A3B，需联网·更快更强）
                                    #   llm      = 本地 GGUF 模型（离线，不上传字幕）
translation_proxy: ""               # gtx / index_api 必填，如 http://127.0.0.1:7897
translation_model_path: ""          # 仅 llm 使用：.gguf 文件或其所在目录；留空 = 内置默认
                                    # 例：models/index-translate-9b 或 D:\models\my-model.Q4_K_M.gguf
swap_subtitles: true               # Rename translated → .srt, original → .{lang}.srt

# --- Cleanup ---

cleanup_temp: true                # Remove temp audio files after completion
